<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daily Task Board — Demo Dhika</title><link rel="stylesheet" href="../style.css"><style>main{max-width:650px;margin:70px auto;padding:24px}h1{font-size:3rem;margin:25px 0}#tasks{list-style:none;padding:0}#tasks li{display:flex;gap:15px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:12px;padding:16px}#tasks input{width:20px;height:20px;margin:0}#tasks span{flex:1;overflow-wrap:anywhere}#tasks .done{text-decoration:line-through;color:var(--muted)}#tasks button{background:none;border:0;color:var(--muted);padding:8px}#task-form{display:flex;flex-wrap:wrap}#task-form input{flex:1;margin:0;min-width:180px}#task-form button{margin:0}</style><script src="tasks.js" defer></script></head><body><main><a href="../index.html#projects">← Kembali ke portofolio</a><p class="section-label" style="margin-top:36px">CONTOH LATIHAN / JAVASCRIPT</p><h1>Daily task board<span style="color:var(--teal)">.</span></h1><p>Satu tugas kecil, satu langkah maju.</p><label for="task-input">Tugas baru</label><form id="task-form"><input id="task-input" required maxlength="160" placeholder="Apa yang ingin dikerjakan?"><button class="button primary">Tambah</button></form><p id="task-status" role="status"></p><ul id="tasks"></ul><p id="empty">Belum ada tugas. Tambahkan tugas pertama Anda.</p><p class="contact-note" id="storage-note">Tugas tersimpan di browser ini. Menghapus data browser juga akan menghapus tugas.</p></main></body></html>
